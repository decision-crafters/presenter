version: 2.1

# Presenter is a single Python project (no sub-projects, no Node).
#
# - Python is pinned to 3.11: kokoro (the offline TTS engine) publishes no wheel
#   for Python 3.13+, and the repo docs require 3.11 specifically.
# - There is no build step (no setup.py / pyproject.toml, the app runs directly)
#   and no linter is configured, so those steps are intentionally skipped.
# - No lockfile exists, so the pip cache is keyed on the requirements files.

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-pip-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
            - v1-pip-

      - run:
          name: Install dependencies
          command: |
            python -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            pip install -r requirements.txt -r requirements-dev.txt

      - save_cache:
          key: v1-pip-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
          paths:
            - ~/.cache/pip

      # No build step: Presenter has no packaging (no setup.py / pyproject.toml).
      # No lint step: no linter (ruff/flake8/black) is configured in the repo.

      - run:
          name: Run tests
          command: |
            . .venv/bin/activate
            python -m pytest -q

workflows:
  version: 2
  test:
    jobs:
      - build-and-test
