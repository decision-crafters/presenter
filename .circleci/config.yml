version: 2.1

# Presenter is a single Python project (no sub-projects, no Node).
#
# - Python is pinned to 3.11: kokoro (the offline TTS engine) publishes no wheel
#   for Python 3.13+, and the repo docs require 3.11 specifically.
# - There is no build step (no packaging, the app runs directly).
# - No lockfile exists, so the pip cache is keyed on the requirements files.
# - Lint (ruff), type checking (mypy), and tests (pytest) run after install.

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-pip-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
            - v1-pip-

      - run:
          name: Install dependencies
          command: |
            python -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            pip install -r requirements.txt -r requirements-dev.txt

      - save_cache:
          key: v1-pip-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
          paths:
            - ~/.cache/pip

      - run:
          name: Lint (ruff)
          command: |
            . .venv/bin/activate
            ruff check .

      - run:
          name: Type check (mypy)
          command: |
            . .venv/bin/activate
            mypy .

      - run:
          name: Run tests
          command: |
            . .venv/bin/activate
            python -m pytest -q

      # The grader the builder never controls (constitution VI): acceptance/
      # tests from the ruling's grader, every base test ID still present, and
      # a diff-size summary. No secrets are used or needed.
      - run:
          name: Grade (acceptance, base test IDs, diff size)
          command: |
            . .venv/bin/activate
            python scripts/ci_grade.py

workflows:
  version: 2
  test:
    jobs:
      - build-and-test
