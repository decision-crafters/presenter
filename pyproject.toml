[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length is the formatter's job

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
# The codebase predates type-checking and uses the `param: dict = None` idiom;
# keep the pre-2.x implicit-Optional behavior.
no_implicit_optional = false
